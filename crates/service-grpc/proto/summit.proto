syntax = "proto3";

package summit;

import "common.proto";
import "options.proto";
import "vessel.proto";
import "google/protobuf/empty.proto";

message BuilderStream {
  message Incoming {
    oneof event {
      BuilderStatus status = 1;
      uint64 build_started = 2;
      BuildLog build_log = 3;
      BuildFinished build_succeeded = 4;
      uint64 build_failed = 5;
      BuilderBusy busy = 6;
      uint64 upload_failed = 7;
    }
  }
  
  message Outgoing {
    oneof event {
      StartBuild start_build = 1;
      UploadBuild upload_build = 2;
      google.protobuf.Empty cancel_build = 3;
    }
  }

  message BuilderStatus {
    // True if the builder is building
    bool building = 1;
    // Current task being built
    // 
    // Not set if builder is busy building a task
    // for another instance of summit
    optional uint64 task_id = 2;
  }

  message StartBuild {
    uint64 task_id = 1;
    string uri = 2;
    string commit_ref = 3;
    string relative_path = 4;
    string build_architecture = 5;
    repeated common.Remote remotes = 6;
  }

  message BuildLog {
    bytes chunk = 1;
  }

  message BuildFinished {
    uint64 task_id = 1;
    repeated common.Collectable collectables = 2;
  }

  message UploadBuild {
    BuildFinished build = 1;
    string token = 2;
    string uri = 3;
  }

  message BuilderBusy {
    uint64 requested_task_id = 1;
    // Not set if builder is busy building a task
    // for another instance of summit
    optional uint64 in_progress_task_id = 2;
  }
}

message RepositoryManagerStream {
  message Incoming {
    oneof event {
      Details details = 1;
      UploadToken upload_token = 2;
      uint64 import_succeeded = 3;
      uint64 import_failed = 4;
      vessel.Command.Response command = 5;
      Status status = 6;
    }
  }

  message Outgoing {
    oneof event {
      RequestUploadToken request_upload_token = 1;
      vessel.Command.Request command = 2;
    }
  }

  message Details {
    string grpc_uri = 1;
  }

  message Status {}

  message RequestUploadToken {
    uint64 task_id = 1;
    repeated common.Collectable collectables = 2;
  }
  
  message UploadToken {
    uint64 task_id = 1;
    repeated common.Collectable collectables = 2;
    string token = 3;
  }
}

message Command {
  message Retry {
    uint64 task_id = 1;
  }
  
  message Cancel {
    uint64 task_id = 1;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

service SummitService {
  // Bidirectional stream between summit & builder
  rpc Builder(stream BuilderStream.Incoming) returns (stream BuilderStream.Outgoing) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "ConnectBuilderStream";
  }

  // Bidirectional stream between summit & repository manager
  rpc RepositoryManager(stream RepositoryManagerStream.Incoming) returns (stream RepositoryManagerStream.Outgoing) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "ConnectRepositoryManagerStream";
  }

  // Commands
  rpc Retry(Command.Retry) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "RetryTask";
  }
  rpc Cancel(Command.Cancel) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "CancelTask";
  }
  rpc Refresh(google.protobuf.Empty) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "Refresh";
  }
  rpc Pause(google.protobuf.Empty) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "Pause";
  }
  rpc Resume(google.protobuf.Empty) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "Resume";
  }
  rpc UpdateStream(vessel.Command.UpdateStream) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "UpdateStream";
  }
  rpc AddTag(vessel.Command.AddTag) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "AddTag";
  }
  rpc RemoveTag(vessel.Command.RemoveTag) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "RemoveTag";
  }
  rpc UpgradeFormat(vessel.Command.FormatUpgrade) returns (Command.Response) {
    option (options.flags) = "SESSION_ACCESS";
    option (options.perm) = "UpgradeFormat";
  }
}
